{% extends "base.html" %}{% block title %}New Case · Cyber Forensics Lab{% endblock %}{% block page_title %}New Investigation{% endblock %}{% block content %}
<div class="page-intro"><div><div class="eyebrow">CASE MANAGEMENT</div><h1>Create investigation</h1><p>Enter the initial details for a new forensic case.</p></div><a class="btn secondary" href="{{ url_for('cases') }}">← Back to cases</a></div>
<form method="post" class="panel form-panel"><div class="form-grid"><label>Case title *<input name="title" required placeholder="e.g. Suspicious authentication activity"></label><label>Investigator *<input name="investigator" required placeholder="Investigator name"></label><label>Category<select name="category"><option>Account Compromise</option><option>Malware Investigation</option><option>Data Exfiltration</option><option>Insider Activity</option><option>General</option></select></label><label>Priority<select name="priority"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></label><label class="full">Description<textarea name="description" rows="4" placeholder="Initial incident context, scope, and objectives..."></textarea></label></div><div class="form-actions"><a class="btn secondary" href="{{ url_for('cases') }}">Cancel</a><button class="btn primary">Create case →</button></div></form>{% endblock %}
